function drawSharpSlash(c, cx, cy, face, a0, a1, k, r1, col = '255,255,255') {
  const to = lerp(a0, a1, Math.min(1, k * 1.7)), from = lerp(a0, a1, Math.max(0, (k - .35) * 1.4));
  if (Math.abs(to - from) < .05) return;
  c.save(); c.translate(cx, cy); c.scale(face, 1);
  const steps = 18, th = 9 * (1 - k * .55);
  const outer = [], inner = [];
  for (let i = 0; i <= steps; i++) {
    const a = lerp(from, to, i / steps), w = Math.sin(Math.PI * i / steps) * th;
    outer.push([Math.cos(a) * r1, Math.sin(a) * r1]); inner.push([Math.cos(a) * (r1 - w), Math.sin(a) * (r1 - w)]);
  }
  c.beginPath(); c.moveTo(outer[0][0], outer[0][1]); for (const q of outer) c.lineTo(q[0], q[1]); for (let i = inner.length - 1; i >= 0; i--) c.lineTo(inner[i][0], inner[i][1]); c.closePath();
  c.fillStyle = `rgba(${col},${.5 * (1 - k * .6)})`; c.fill();
  c.strokeStyle = `rgba(${col},${.95 * (1 - k * .5)})`; c.lineWidth = 1.4; c.beginPath(); c.moveTo(outer[0][0], outer[0][1]); for (const q of outer) c.lineTo(q[0], q[1]); c.stroke();
  c.restore();
}

function Builder(theme, seed) {
  const L = { theme, solids: [], traps: [], spawns: [], decor: [], cps: [], hints: [], pits: [], box: null, scroll: null, arena: null, width: 0, deathY: 700 };
  const rng = mulberry32(seed);
  let x = 0, gy = 440, ax = 0, agy = 440;   // ax/agy: anchor = start of the last flat or gap
  const autoDecor = (x0, x1) => {
    let dx = x0 + 60 + rng() * 200;
    while (dx < x1 - 60) {
      const r = rng();
      if (theme === 'fog') { if (r < .35) L.decor.push({ k: 'tree', x: dx, y: gy, w: 16 + rng() * 22, s: rng() * 1e3 }); else if (r < .55) L.decor.push({ k: 'stump', x: dx, y: gy }); else if (r < .7) L.decor.push({ k: 'reeds', x: dx, y: gy }); }
      else if (theme === 'saw') { if (r < .3) L.decor.push({ k: 'post', x: dx, y: gy, h: 120 + rng() * 140 }); else if (r < .5) L.decor.push({ k: 'tree', x: dx, y: gy, w: 14 + rng() * 16, s: rng() * 1e3 }); else if (r < .65) L.decor.push({ k: 'reeds', x: dx, y: gy }); }
      else if (theme === 'snow') { if (r < .38) L.decor.push({ k: 'pine', x: dx, y: gy, h: 150 + rng() * 170 }); else if (r < .55) L.decor.push({ k: 'rock', x: dx, y: gy }); }
      else if (theme === 'rain' || theme === 'bloom') { if (r < .3) L.decor.push({ k: 'sakura', x: dx, y: gy, h: 230 + rng() * 140, s: rng() * 1e3 }); else if (r < .45) L.decor.push({ k: 'reeds', x: dx, y: gy }); else if (r < .55 && theme === 'bloom') L.decor.push({ k: 'lamp', x: dx, y: gy }); }
      dx += 260 + rng() * 380;
    }
  };
  const B = {
    L, rng,
    get x() { return ax; }, get gy() { return agy; }, get end_() { return x; },
    flat(len, o = {}) { ax = x; agy = gy; L.solids.push({ x, y: gy, w: len, h: 900, t: 0, ice: !!o.ice }); if (!o.bare) autoDecor(x, x + len); x += len; return B; },
    up(dh) { gy -= dh; return B; },
    down(dh) { gy += dh; return B; },
    gap(w) { ax = x; agy = gy; L.pits.push({ x, w, y: gy }); x += w; return B; },
    plat(dx, h, w, o = {}) { L.solids.push(Object.assign({ x: ax + dx, y: agy - h, w, h: 12, t: 1 }, o)); return B; },
    e(type, dx, h = 0) { L.spawns.push({ type, x: ax + dx, y: agy - h }); return B; },
    trap(k, dx, o = {}) { L.traps.push(Object.assign({ k, x: ax + dx, y: agy }, o)); return B; },
    cp(dx) { L.cps.push({ x: ax + dx, y: agy, lit: false }); L.decor.push({ k: 'lantern', x: ax + dx, y: agy, cp: L.cps.length - 1 }); return B; },
    scroll(dx, h) { L.scroll = { x: ax + dx, y: agy - h, got: false }; return B; },
    hint(s, dx, h = 120) { L.hints.push({ s, x: ax + dx, y: agy - h }); return B; },
    deco(k, dx, o = {}) { L.decor.push(Object.assign({ k, x: ax + dx, y: agy }, o)); return B; },
    box(dx) { L.box = { x: ax + dx, y: agy - 58, w: 58, h: 58, hp: 4, maxHp: 4, broken: false, shake: 0 }; return B; },
    end() {
      L.width = x;
      L.solids.push({ x: -60, y: -800, w: 60, h: 2000, t: 0, wall: true }, { x: x, y: -800, w: 60, h: 2000, t: 0, wall: true });
      const gr = L.solids.filter(s => !s.wall && s.t === 0);
      for (const s of gr) { s.nl = gr.some(o => o !== s && Math.abs(o.x + o.w - s.x) < 1 && o.y <= s.y + 2); s.nr = gr.some(o => o !== s && Math.abs(o.x - (s.x + s.w)) < 1 && o.y <= s.y + 2); }
      L.deathY = Math.max(...gr.map(s => s.y)) + 190;
      return L;
    }
  };
  return B;
}

    c.fillStyle = 'rgba(0,0,0,.62)'; c.fillRect(0, 0, W, H);
    const a = clamp(this.t / 1.2, 0, 1);
    c.save(); c.globalAlpha = a;
    c.shadowColor = '#fff'; c.shadowBlur = 30 * RS;
    txt(c, this.ch.kan, W / 2, H / 2 - 30, 150, '#fff', 'center', F_JP);
    c.shadowBlur = 0;
    txt(c, 'C H A P T E R   ' + NUMERALS[this.i].split('').join(' '), W / 2, H / 2 + 80, 16, 'rgba(255,255,255,.6)', 'center', F_SC);
    txt(c, this.ch.name, W / 2, H / 2 + 116, 30, '#efede8', 'center', 'italic ' + F_SERIF);
    { const n = Math.min(4, this.i + 1), E = ELEMS[n - 1], a2 = clamp((this.t - 1) / 1, 0, 1);
      c.globalAlpha = a; c.globalAlpha *= a2;
      if (this.i === 5) { c.shadowColor = 'rgb(190,140,255)'; c.shadowBlur = 14 * RS; txt(c, 'someone owes you a cake', W / 2, H / 2 + 170, 18, 'rgba(225,205,255,.85)', 'center', 'italic ' + F_SERIF); c.shadowBlur = 0; }
      else if (this.i >= 4) { txt(c, 'all four elements awaken', W / 2, H / 2 + 160, 17, 'rgba(255,255,255,.75)', 'center', 'italic ' + F_SERIF);
        ELEMS.forEach((e, j) => { c.shadowColor = `rgb(${e.rgb})`; c.shadowBlur = 14 * RS; txt(c, e.kan, W / 2 + (j - 1.5) * 44, H / 2 + 196, 26, `rgb(${e.rgb})`, 'center', F_JP); }); c.shadowBlur = 0; }
      else { txt(c, 'new power', W / 2, H / 2 + 160, 15, 'rgba(255,255,255,.6)', 'center', F_SC); c.shadowColor = `rgb(${E.rgb})`; c.shadowBlur = 14 * RS;
        txt(c, E.kan + '  ' + E.name, W / 2, H / 2 + 192, 24, `rgb(${E.rgb})`, 'center', 'italic ' + F_SERIF); c.shadowBlur = 0; }
      c.globalAlpha = a; }
    c.restore();
    drawPost(c, this.t);
  }
}
/* =========================================================
   MAIN - boot + loop
   ========================================================= */
(async function boot() {
  loadSave(); resize(); setupTouch(); initMusicEls(); makeSprites();
  const fontWait = (async () => {
    try {
      await Promise.race([Promise.all([
        document.fonts.load('30px "IM Fell English"'), document.fonts.load('italic 30px "Cormorant Garamond"'),
        document.fonts.load('30px "Cormorant Garamond"'), document.fonts.load('16px "IM Fell English SC"'), document.fonts.load('30px "Noto Serif JP"', '愛')
      ]), new Promise(r => setTimeout(r, 2500))]);
    } catch (e) { }
  })();
  await Promise.all([fontWait, loadContent()]);
  getScenery('fog');
  const q = new URLSearchParams(location.search);
  let first = new TitleScene();
  if (DEV) {
    if (q.has('level')) { const i = clamp((parseInt(q.get('level'), 10) || 1) - 1, 0, 4); save.level = i; save.cp = -1; first = new CardScene(i); }
    if (q.has('boss')) { save.level = 4; save.cp = -1; first = new PlayScene(4, { devBoss: true }); }
    if (q.has('cake')) { save.level = 4; first = new PlayScene(4, { devBoss: true }); setTimeout(() => { const s = Game.scene; if (s instanceof PlayScene) { if (!s.boss) s.startBoss(); s.boss.st = 'idle'; s.boss.inv = 0; s.boss.hp = 1; s.hitBoss(5, 1); } }, 1200); }
    if (q.has('ending')) { setTimeout(() => showEnding({ extra: true }), 300); }
    if (q.has('twin')) first = new CardScene(5);
    if (q.has('duel')) { first = new PlayScene(4, { twinStart: true }); setTimeout(() => { const s = Game.scene; if (s instanceof PlayScene && s.boy) { s.boy.x = s.p.x + 113; s.cut = { t: 0, step: 'reveal', line: 0, chars: 0 }; } }, 400); }
    if (q.has('sounds')) setTimeout(() => {
      const o = overlay(); const m = el('div', 'menu'); m.style.maxHeight = '100%'; m.style.overflow = 'auto'; m.style.touchAction = 'pan-y';
      m.appendChild(el('h1', '', 'sound board'));
      m.appendChild(el('p', '', 'tap a sound to hear it as the game plays it now (built-in, off, or your file)'));
      const grid = el('div', 'row');
      for (const [slot, label, keys] of SOUND_SLOTS) { const v = CONTENT.sounds[slot]; grid.appendChild(btn(label + (v === 'off' ? '  (off)' : mediaUrl(v) ? '  (your file)' : ''), () => { unlockAudio(); setTimeout(() => sfx(keys[0]), 60); })); }
      m.appendChild(grid); o.appendChild(m);
    }, 500);
    if (q.has('reward')) { const i = clamp((parseInt(q.get('reward'), 10) || 1) - 1, 0, 3); first = new PlayScene(i); setTimeout(() => openReward(Game.scene), 800); }
  }
  Game.set(first);
  const b = $('boot'); b.style.opacity = 0; setTimeout(() => b.remove(), 900);
  let last = performance.now(), acc = 0;
  const STEP = 1 / 60;
  function frame(now) {
    requestAnimationFrame(frame);
    let dt = (now - last) / 1000; last = now;
    if (dt > .25) dt = .25;
    musicTick(dt);
    const blocked = isPortraitBlocked();
    if (!blocked && !Game.paused) {
      acc += dt;
      let n = 0;
      while (acc >= STEP && n < 5) {
        try { Game.scene.update(STEP); } catch (e) { console.error(e); }
        clearEdges(); acc -= STEP; n++;
        if (Game.fadeDir !== 0) {
          Game.fade = clamp(Game.fade + Game.fadeDir * STEP / .55, 0, 1);
          if (Game.fadeDir === 1 && Game.fade >= 1) { if (Game.next) { const nx = Game.next; Game.next = null; Game.set(nx); } Game.fadeDir = -1; }
          else if (Game.fadeDir === -1 && Game.fade <= 0) Game.fadeDir = 0;
        }
      }
      if (n >= 5) acc = 0;
    } else { clearEdges(); }
    try { Game.scene.draw(ctx); } catch (e) { console.error(e); }
    if (Game.fade > 0) { ctx.setTransform(RS, 0, 0, RS, 0, 0); ctx.globalAlpha = Game.fade; ctx.fillStyle = Game.fadeCol; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  }
  requestAnimationFrame(frame);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { for (const a of music.els) if (!a.paused) { a._wasPlaying = true; a.pause(); } if (AC) AC.suspend(); if (Game.scene instanceof PlayScene && Game.scene.mode === 'play' && !Game.paused) openPause(Game.scene); }
    else { if (AC) AC.resume(); for (const a of music.els) if (a._wasPlaying) { a._wasPlaying = false; a.play().catch(() => { }); } }
  });
})();
